services:
  # 1. Database (Shared event_tracker_db)
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: event_tracker_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # 2. Service Discovery (Eureka)
  service-discovery:
    build: ./apps/service-discovery
    ports:
      - "8761:8761"

  # 3. Auth Service
  auth-service:
    build: ./apps/auth-service
    ports:
      - "8081:8081"
    depends_on:
      - db
      - service-discovery
    environment:
      - AUTH_DB_URL=jdbc:postgresql://db:5432/event_tracker_db
      - DB_USERNAME=postgres
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - EUREKA_SERVER_URL=http://service-discovery:8761/eureka/
      - APP_JWT_SECRET=${JWT_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}

  # 4. AI Extraction Service
  ai-extraction-service:
    build: ./apps/ai-extraction-service
    ports:
      - "8082:8082"
    depends_on:
      - service-discovery
    environment:
      - EUREKA_SERVER_URL=http://service-discovery:8761/eureka/
      - GEMINI_API_KEY=${GEMINI_API_KEY}

  # 5. Core Backend
  backend:
    build: ./apps/backend
    ports:
      - "8085:8085"
    depends_on:
      - db
      - service-discovery
    environment:
      - DB_URL=jdbc:postgresql://db:5432/event_tracker_db
      - DB_USERNAME=postgres
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - EUREKA_SERVER_URL=http://service-discovery:8761/eureka/
      - JWT_SECRET=${JWT_SECRET}

  # 6. API Gateway (Main entry point on 8080)
  api-gateway:
    build: ./apps/api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - service-discovery
    environment:
      - EUREKA_SERVER_URL=http://service-discovery:8761/eureka/

  # 7. React Web Frontend
  web:
    build: ./apps/web
    ports:
      - "5173:5173"
    depends_on:
      - api-gateway

volumes:
  pgdata:
