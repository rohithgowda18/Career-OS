spring:
  datasource:
    url: jdbc:h2:mem:auth_test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: 

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-google-id
            client-secret: test-google-secret
          github:
            client-id: test-github-id
            client-secret: test-github-secret

app:
  jwt:
    secret: "test-jwt-secret-key-that-is-at-least-64-characters-long-to-satisfy-hs512-requirements"
    expiration: 86400000
  cors:
    allowed-origins: "http://localhost:5173"
  oauth2:
    redirect-url: "http://localhost:5173/oauth-success"
