server:
  port: ${AUTH_SERVICE_PORT:${PORT_AUTH:8081}}

spring:
  config:
    import: optional:file:.env[.properties], optional:file:../backend/.env[.properties]

  main:
    allow-circular-references: true

  application:
    name: career-os-auth-service

  datasource:
    url: ${AUTH_DB_URL:jdbc:postgresql://localhost:5432/career_os_auth_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    hibernate:
      ddl-auto: update

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            scope:
              - user:email
              - read:user
        provider:
          github:
            user-info-uri: https://api.github.com/user
            user-name-attribute: name

app:
  jwt:
    secret: ${APP_JWT_SECRET:${JWT_SECRET}}
    expiration: 1296000000

  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://career-os.rohith.app}}

  oauth2:
    redirect-url: ${OAUTH2_REDIRECT_URL:${FRONTEND_URL:https://career-os.rohith.app}/oauth-success}

logging:
  level:
    com.careeros.auth.security: DEBUG
    com.careeros.auth.controller: DEBUG
    com.careeros.auth.service: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    root: INFO

management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: "health,info"

  endpoint:
    health:
      show-details: always
