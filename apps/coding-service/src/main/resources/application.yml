server:
  port: ${CODING_SERVICE_PORT:${PORT_CODING:8084}}

spring:
  config:
    import: optional:file:.env[.properties], optional:file:../../.env[.properties]
  application:
    name: career-os-coding-service
  datasource:
    url: ${CODING_DB_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/career_os_coding_db}}
    username: ${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:postgres}}
    password: ${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:Rohk_1265}}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

app:
  jwt:
    secret: ${JWT_SECRET:this-is-a-very-long-secret-key-that-is-at-least-64-characters-long-to-satisfy-hs512-requirements}
  coding:
    leetcode:
      graphql-url: ${LEETCODE_GRAPHQL_URL:https://leetcode.com/graphql}
    verification-expiration-minutes: ${VERIFICATION_EXPIRATION_MINUTES:15}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    com.careeros.coding: INFO
    org.springframework.web: INFO
    org.springframework.security: WARN
