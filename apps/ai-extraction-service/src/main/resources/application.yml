server:
  port: ${PORT:8082}

app:
  internal-key: ${AI_SERVICE_INTERNAL_KEY:${INTERNAL_SERVICE_KEY:career-os-internal-ai-secret}}

gemini:
  api:
    key: ${GEMINI_API_KEY:}
    model: ${GEMINI_API_MODEL:gemini-2.5-flash}

logging:
  level:
    com.careeros.ai: DEBUG
    root: INFO

management:
  endpoints:
    web:
      exposure:
        include: "health,info"
  endpoint:
    health:
      show-details: always
