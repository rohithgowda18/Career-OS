spring:
  application:
    name: ai-extraction-service
  config:
    import: optional:file:.env[.properties], optional:file:../../.env[.properties], optional:file:../backend/.env[.properties]

server:
  port: ${AI_PORT:8082}

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    registry-fetch-interval-seconds: 5
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 10

gemini:
  api:
    key: ${GEMINI_API_KEY:}
    model: ${GEMINI_API_MODEL:gemini-2.5-flash}

logging:
  level:
    com.careeros.ai: DEBUG
    root: INFO

management:
  endpoints:
    web:
      exposure:
        include: "health,info"
  endpoint:
    health:
      show-details: always
