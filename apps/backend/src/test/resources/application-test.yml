spring:
  # Use an in-memory DB for tests by default.
  datasource:
    url: jdbc:h2:mem:eventtracker_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: never
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  # Avoid accidental external calls during tests
  mail:
    host: localhost
    port: 2525

logging:
  level:
    org.springframework.security: WARN

app:
  jwt:
    secret: this-is-a-very-long-secret-key-that-is-at-least-64-characters-long-to-satisfy-hs512-requirements
  cors:
    allowed-origins: http://localhost:5173
  jobs:
    provider: adzuna
    adzuna:
      app-id: test-app-id
      app-key: test-app-key

