spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: career-os

  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 5000
            readTimeout: 60000
            loggerLevel: basic
          ai-extraction-service:
            connectTimeout: 5000
            readTimeout: 60000
            loggerLevel: basic

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/event_tracker_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    hibernate:
      ddl-auto: none

  sql:
    init:
      mode: always

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${PORT:8080}

app:
  jwt:
    secret: ${APP_JWT_SECRET:${JWT_SECRET}}

  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://career-os.rohith.app}}

  ai-extraction-service:
    url: ${AI_EXTRACTION_SERVICE_URL:http://localhost:8082}

  jobs:
    provider: ${JOB_PROVIDER:adzuna}
    adzuna:
      app-id: ${ADZUNA_APP_ID:}
      app-key: ${ADZUNA_APP_KEY:}
      country: ${ADZUNA_COUNTRY:in}
      base-url: ${ADZUNA_BASE_URL:https://api.adzuna.com/v1/api/jobs}


logging:
  level:
    com.eventtracker.security: DEBUG
    com.eventtracker.controller: DEBUG
    com.eventtracker.service: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    root: INFO

management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: "health,info"

  endpoint:
    health:
      show-details: always
