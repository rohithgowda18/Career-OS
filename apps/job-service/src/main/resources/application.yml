server:
  port: ${PORT:8083}

spring:
  application:
    name: career-os-job-service
  config:
    import: optional:file:.env[.properties], optional:file:../../.env[.properties], optional:file:../backend/.env[.properties]

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://career-os.rohith.app}}
  jobvetta:
    base-url: ${JOBVETTA_BASE_URL:https://api.jobvetta.com/v1}
    api-key: ${JOBVETTA_API_KEY:}

logging:
  level:
    com.careeros.job: DEBUG
    root: INFO

management:
  endpoints:
    web:
      exposure:
        include: "health,info"
  endpoint:
    health:
      show-details: always
